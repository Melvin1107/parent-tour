<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學校親子遊 - 報名資料核對與繳款收據</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 p-4 md:p-8">
  <div class="max-w-2xl mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6 md:p-8 space-y-6">

    <header class="border-b pb-4 text-center">
      <h1 class="text-2xl font-bold text-slate-900">115年度忠孝國小親子遊</h1>
      <p class="text-sm text-slate-500 mt-1">報名資料核對與繳款確認</p>
    </header>

    <!-- 查詢區塊 -->
    <section id="searchSection" class="bg-slate-50 border p-4 rounded-xl space-y-3">
      <label class="block text-sm font-semibold text-slate-700">請輸入報名時填寫的「家長電話」或「身分證字號」：</label>
      <div class="flex gap-2">
        <input type="text" id="queryInput" placeholder="例：0912345678 或 A123456789" class="flex-1 border rounded p-2 text-sm uppercase outline-none focus:ring-2 focus:ring-emerald-500">
        <button id="searchBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white px-5 py-2 rounded text-sm font-medium transition">查詢資料</button>
      </div>
      <p id="searchMsg" class="text-xs text-red-500 hidden"></p>
    </section>

    <!-- 核對與修改表單 (查詢成功後展開) -->
    <form id="editForm" class="hidden space-y-6">
      
      <div class="flex items-center justify-between bg-emerald-50 border border-emerald-200 p-3 rounded-lg text-emerald-800 text-sm">
        <div>報名編號：<strong id="displaySerial" class="text-lg font-mono">---</strong></div>
        <div id="displayPayStatus" class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold">未繳費</div>
      </div>

      <!-- 家長資料 -->
      <section class="space-y-3">
        <h2 class="text-base font-bold text-emerald-800 border-l-4 border-emerald-600 pl-2">家長資料</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-sm">
          <div>
            <label class="block text-xs font-medium mb-1">姓名 *</label>
            <input type="text" id="parentName" required class="w-full border rounded p-2 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">關係 *</label>
            <input type="text" id="parentRelation" required class="w-full border rounded p-2 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">手機號碼 *</label>
            <input type="tel" id="parentPhone" required class="w-full border rounded p-2 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">電子信箱 (收據寄送) *</label>
            <input type="email" id="parentEmail" required class="w-full border rounded p-2 outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">身分證字號 *</label>
            <input type="text" id="parentId" maxlength="10" required class="w-full border rounded p-2 uppercase outline-none">
          </div>
          <div>
            <label class="block text-xs font-medium mb-1">生日 *</label>
            <input type="date" id="parentDob" required class="calc-age w-full border rounded p-2 outline-none">
          </div>
        </div>
      </section>

      <!-- 學生資料 -->
      <section class="space-y-3">
        <h2 class="text-base font-bold text-emerald-800 border-l-4 border-emerald-600 pl-2">參加學生資料</h2>
        <div id="studentsWrapper" class="space-y-3"></div>
      </section>

      <!-- 親友資料 -->
      <section class="space-y-3">
        <h2 class="text-base font-bold text-emerald-800 border-l-4 border-emerald-600 pl-2">同行親友資料</h2>
        <div id="othersWrapper" class="space-y-3"></div>
      </section>

      <!-- 飲食與備註 -->
      <section class="space-y-3 border-t pt-4 text-sm">
        <div class="flex justify-between items-center mb-1">
          <label class="font-medium">飲食習慣統計 *</label>
          <span id="dietStatusText" class="text-xs font-semibold"></span>
        </div>
        <div class="grid grid-cols-2 gap-3 bg-slate-50 border p-3 rounded-lg">
          <div class="flex items-center space-x-2">
            <span class="text-sm">葷食：</span>
            <input type="number" id="meatCount" min="0" class="w-16 border rounded p-1 text-center text-sm outline-none">
            <span class="text-xs text-slate-500">人</span>
          </div>
          <div class="flex items-center space-x-2">
            <span class="text-sm">素食：</span>
            <input type="number" id="vegCount" min="0" class="w-16 border rounded p-1 text-center text-sm outline-none">
            <span class="text-xs text-slate-500">人</span>
          </div>
        </div>
        <div>
          <label class="block text-xs font-medium mb-1">備註</label>
          <input type="text" id="notes" class="w-full border rounded p-2 outline-none text-sm">
        </div>
      </section>

      <!-- 金額與確認繳款 -->
      <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
        <div>
          <div class="text-xs text-slate-600">核對總人數：<span id="displayCount" class="font-bold text-emerald-800 text-base">0</span> 人</div>
          <div class="text-xs text-slate-600">應繳總金額：<span id="displayFee" class="font-bold text-emerald-800 text-xl">NT$ 0</span></div>
        </div>
        <button type="submit" id="payConfirmBtn" class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-lg transition shadow">確認繳款並產生收據</button>
      </div>

    </form>

    <!-- 繳費收據預覽 (依圖案設計：收執聯 + 存根聯) -->
    <div id="receiptSection" class="hidden space-y-4 pt-4 border-t">
      <div class="bg-white border-2 border-slate-700 p-6 rounded-lg shadow space-y-6">
        
        <!-- 收執聯 -->
        <div class="border-b-2 border-dashed border-slate-400 pb-6 space-y-4">
          <h2 class="text-xl font-bold text-center tracking-widest text-slate-900">112年度忠孝國小親子遊收據</h2>
          <div class="text-base space-y-3 pt-2">
            <div>
              茲收到 <span id="rcpStudent1" class="font-bold border-b border-slate-700 px-4 inline-block min-w-[120px] text-center"></span> 同學報名112年親子遊共 <span id="rcpCount1" class="font-bold border-b border-slate-700 px-3 inline-block min-w-[50px] text-center"></span> 位
            </div>
            <div>
              金額 <span id="rcpFee1" class="font-bold border-b border-slate-700 px-4 inline-block min-w-[160px] text-center text-emerald-700"></span> 元整
            </div>
          </div>
          <div class="text-right pt-2">
            <div class="text-base font-bold">忠孝國小家長會</div>
            <div class="text-xs text-slate-500 mt-1">收執聯（報名編號：<span id="rcpSerial1"></span>）</div>
          </div>
        </div>

        <!-- 存根聯 -->
        <div class="space-y-4">
          <h2 class="text-xl font-bold text-center tracking-widest text-slate-900">112年度忠孝國小親子遊收據</h2>
          <div class="text-base space-y-3 pt-2">
            <div>
              茲收到 <span id="rcpStudent2" class="font-bold border-b border-slate-700 px-4 inline-block min-w-[120px] text-center"></span> 同學報名112年親子遊共 <span id="rcpCount2" class="font-bold border-b border-slate-700 px-3 inline-block min-w-[50px] text-center"></span> 位
            </div>
            <div>
              金額 <span id="rcpFee2" class="font-bold border-b border-slate-700 px-4 inline-block min-w-[160px] text-center text-emerald-700"></span> 元整
            </div>
          </div>
          <div class="text-right pt-2">
            <div class="text-base font-bold">忠孝國小家長會</div>
            <div class="text-xs text-slate-500 mt-1">存根聯（報名編號：<span id="rcpSerial2"></span>）</div>
          </div>
        </div>

      </div>

      <div class="text-center">
        <button onclick="window.print()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs px-5 py-2 rounded transition">列印收據</button>
      </div>
    </div>

  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3sIZ5oYH7U_X4V-P8qwpXwf-nt2aPKSwWj9onWfg5N266PqLBQIwmTy-BP1Sydvj6/exec";
    const EVENT_DATE = new Date("2026-11-21");

    let currentData = null;

    // 年齡與計費
    function calculateAge(dobStr) {
      if (!dobStr) return 30;
      const dob = new Date(dobStr);
      let age = EVENT_DATE.getFullYear() - dob.getFullYear();
      const m = EVENT_DATE.getMonth() - dob.getMonth();
      if (m < 0 || (m === 0 && EVENT_DATE.getDate() < dob.getDate())) age--;
      return age;
    }

    function getFeeByDob(dobStr) {
      const age = calculateAge(dobStr);
      if (age < 3) return 0;
      if (age <= 6) return 500;
      if (age <= 12) return 1300;
      if (age >= 70) return 1300;
      return 1420;
    }

// 查詢按鈕改用標準 fetch (自動處理 302 重導向)
    document.getElementById('searchBtn').addEventListener('click', async () => {
      const q = document.getElementById('queryInput').value.trim();
      const msg = document.getElementById('searchMsg');
      if (!q) {
        msg.innerText = "請輸入電話或身分證號";
        msg.classList.remove('hidden');
        return;
      }
      msg.classList.add('hidden');

      const btn = document.getElementById('searchBtn');
      btn.innerText = "查詢中...";
      btn.disabled = true;

      try {
        const response = await fetch(`${SCRIPT_URL}?query=${encodeURIComponent(q)}`);
        const res = await response.json();

        if (res.result === "success") {
          currentData = res.data;
          renderForm(res.data);
        } else {
          msg.innerText = res.message || "查無此報名資料";
          msg.classList.remove('hidden');
        }
      } catch (err) {
        msg.innerText = "查詢失敗，請重新整理後再試一次。";
        msg.classList.remove('hidden');
      } finally {
        btn.innerText = "查詢資料";
        btn.disabled = false;
      }
    });

    // 渲染資料進表單
    function renderForm(d) {
      document.getElementById('displaySerial').innerText = d.serial;
      document.getElementById('displayPayStatus').innerText = d.payStatus;
      
      document.getElementById('parentName').value = d.parentName || "";
      document.getElementById('parentRelation').value = d.parentRelation || "";
      document.getElementById('parentPhone').value = d.parentPhone || "";
      document.getElementById('parentEmail').value = d.parentEmail || "";
      document.getElementById('parentId').value = d.parentId || "";
      document.getElementById('parentDob').value = d.parentDob || "";

      // 學生列表 (最多 4 位)
      const sWrapper = document.getElementById('studentsWrapper');
      sWrapper.innerHTML = "";
      for (let i = 1; i <= 4; i++) {
        const sName = d[`student${i}Name`];
        if (sName || i === 1) {
          const div = document.createElement('div');
          div.className = "p-3 bg-slate-50 border rounded-lg grid grid-cols-1 md:grid-cols-4 gap-2 text-xs";
          div.innerHTML = `
            <div>
              <label class="block text-slate-500 mb-0.5">學生 ${i} 姓名</label>
              <input type="text" id="student${i}Name" value="${sName || ''}" class="w-full border rounded p-1.5 outline-none">
            </div>
            <div>
              <label class="block text-slate-500 mb-0.5">班級</label>
              <input type="text" id="student${i}Class" value="${d[`student${i}Class`] || ''}" class="w-full border rounded p-1.5 outline-none">
            </div>
            <div>
              <label class="block text-slate-500 mb-0.5">身分證字號</label>
              <input type="text" id="student${i}Id" value="${d[`student${i}Id`] || ''}" maxlength="10" class="w-full border rounded p-1.5 uppercase outline-none">
            </div>
            <div>
              <label class="block text-slate-500 mb-0.5">出生日期</label>
              <input type="date" id="student${i}Dob" value="${d[`student${i}Dob`] || ''}" class="calc-age w-full border rounded p-1.5 outline-none">
            </div>
          `;
          sWrapper.appendChild(div);
        }
      }

      // 親友列表 (最多 4 位)
      const oWrapper = document.getElementById('othersWrapper');
      oWrapper.innerHTML = "";
      for (let i = 1; i <= 4; i++) {
        const oName = d[`other${i}Name`];
        if (oName) {
          const div = document.createElement('div');
          div.className = "p-3 bg-slate-50 border rounded-lg grid grid-cols-1 md:grid-cols-3 gap-2 text-xs other-row";
          div.innerHTML = `
            <div>
              <label class="block text-slate-500 mb-0.5">親友 ${i} 姓名</label>
              <input type="text" id="other${i}Name" value="${oName}" class="w-full border rounded p-1.5 outline-none">
            </div>
            <div>
              <label class="block text-slate-500 mb-0.5">身分證字號</label>
              <input type="text" id="other${i}Id" value="${d[`other${i}Id`] || ''}" maxlength="10" class="w-full border rounded p-1.5 uppercase outline-none">
            </div>
            <div>
              <label class="block text-slate-500 mb-0.5">出生日期</label>
              <input type="date" id="other${i}Dob" value="${d[`other${i}Dob`] || ''}" class="calc-age w-full border rounded p-1.5 outline-none">
            </div>
          `;
          oWrapper.appendChild(div);
        }
      }
      if (oWrapper.children.length === 0) {
        oWrapper.innerHTML = `<div class="text-xs text-slate-400">無同行親友</div>`;
      }

      // 解析飲食習慣 (例如 "葷食 2 人 / 素食 0 人")
      const dietStr = d.dietPreference || "";
      const mMatch = dietStr.match(/葷食\s*(\d+)/);
      const vMatch = dietStr.match(/素食\s*(\d+)/);
      document.getElementById('meatCount').value = mMatch ? parseInt(mMatch[1], 10) : d.totalHeadcount;
      document.getElementById('vegCount').value = vMatch ? parseInt(vMatch[1], 10) : 0;
      document.getElementById('notes').value = d.notes === "無" ? "" : (d.notes || "");

      document.getElementById('editForm').classList.remove('hidden');
      recalcTotal();
    }

    // 動態重新核算總人數與總金額
    function recalcTotal() {
      let count = 1;
      let fee = getFeeByDob(document.getElementById('parentDob').value);

      for (let i = 1; i <= 4; i++) {
        const sNameEl = document.getElementById(`student${i}Name`);
        if (sNameEl && sNameEl.value.trim()) {
          count++;
          fee += getFeeByDob(document.getElementById(`student${i}Dob`).value);
        }
      }

      for (let i = 1; i <= 4; i++) {
        const oNameEl = document.getElementById(`other${i}Name`);
        if (oNameEl && oNameEl.value.trim()) {
          count++;
          fee += getFeeByDob(document.getElementById(`other${i}Dob`).value);
        }
      }

      document.getElementById('displayCount').innerText = count;
      document.getElementById('displayFee').innerText = `NT$ ${fee.toLocaleString()}`;

      // 檢查飲食總數
      const m = parseInt(document.getElementById('meatCount').value || '0', 10);
      const v = parseInt(document.getElementById('vegCount').value || '0', 10);
      const statusText = document.getElementById('dietStatusText');
      if (m + v === count) {
        statusText.innerText = `餐數相符 (${count} 人)`;
        statusText.className = "text-xs text-emerald-600 font-semibold";
      } else {
        statusText.innerText = `目前設定 ${m + v} 餐，與總人數 ${count} 人不一致`;
        statusText.className = "text-xs text-amber-600 font-semibold";
      }

      return { count, fee, m, v };
    }

    document.addEventListener('change', (e) => {
      if (e.target.classList.contains('calc-age')) recalcTotal();
    });
    document.getElementById('meatCount').addEventListener('input', recalcTotal);
    document.getElementById('vegCount').addEventListener('input', recalcTotal);

    // 提交繳款並更新
    document.getElementById('editForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const { count, fee, m, v } = recalcTotal();

      const payload = {
        rowIndex: currentData.rowIndex,
        serialNumber: currentData.serial,
        parentName: document.getElementById('parentName').value.trim(),
        parentRelation: document.getElementById('parentRelation').value.trim(),
        parentPhone: document.getElementById('parentPhone').value.trim(),
        parentEmail: document.getElementById('parentEmail').value.trim(),
        parentId: document.getElementById('parentId').value.trim().toUpperCase(),
        parentDob: document.getElementById('parentDob').value,
        totalHeadcount: count,
        estimatedFee: fee,
        dietPreference: `葷食 ${m} 人 / 素食 ${v} 人`,
        notes: document.getElementById('notes').value.trim()
      };

      for (let i = 1; i <= 4; i++) {
        const sNameEl = document.getElementById(`student${i}Name`);
        payload[`student${i}Name`] = sNameEl ? sNameEl.value.trim() : "";
        payload[`student${i}Class`] = sNameEl ? document.getElementById(`student${i}Class`).value.trim() : "";
        payload[`student${i}Id`] = sNameEl ? document.getElementById(`student${i}Id`).value.trim().toUpperCase() : "";
        payload[`student${i}Dob`] = sNameEl ? document.getElementById(`student${i}Dob`).value : "";
      }

      for (let i = 1; i <= 4; i++) {
        const oNameEl = document.getElementById(`other${i}Name`);
        payload[`other${i}`] = oNameEl ? {
          name: oNameEl.value.trim(),
          id: document.getElementById(`other${i}Id`).value.trim().toUpperCase(),
          dob: document.getElementById(`other${i}Dob`).value
        } : null;
      }

      const btn = document.getElementById('payConfirmBtn');
      btn.innerText = "資料更新與寄送收據中...";
      btn.disabled = true;

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        // 渲染收據並呈現
        const sName = payload.student1Name;
        document.getElementById('rcpStudent1').innerText = sName;
        document.getElementById('rcpStudent2').innerText = sName;
        document.getElementById('rcpCount1').innerText = count;
        document.getElementById('rcpCount2').innerText = count;
        document.getElementById('rcpFee1').innerText = fee.toLocaleString();
        document.getElementById('rcpFee2').innerText = fee.toLocaleString();
        document.getElementById('rcpSerial1').innerText = currentData.serial;
        document.getElementById('rcpSerial2').innerText = currentData.serial;

        document.getElementById('receiptSection').classList.remove('hidden');
        document.getElementById('displayPayStatus').innerText = "已繳費";
        document.getElementById('displayPayStatus').className = "bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold";

        alert("繳費完成！正式收據已發送至您的信箱，副本已同步寄給工作人員。");
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });

      } catch (err) {
        alert("連線失敗，請檢查網路。");
      } finally {
        btn.innerText = "確認繳款並產生收據";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
